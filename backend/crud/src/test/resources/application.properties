# Este arquivo SUBSTITUI o application.properties do main durante os testes
# (o classpath de teste vem primeiro). Por isso os testes nao precisam do
# Postgres rodando nem da variavel DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: o Hibernate cria as tabelas no inicio e apaga no fim,
# deixando cada execucao de teste partir de um banco limpo.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
